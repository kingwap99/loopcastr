#############################################################
# loopcastr - local media hub (MediaMTX) example configuration
#
# install.sh copies this file over when mediamtx.yml does not exist;
# make real changes in mediamtx.yml and never write site details back into this example.
#
# Data flow:
#   playout.sh   → rtmp://127.0.0.1:1935/live/main
#   yt_publish.sh ← rtmp://127.0.0.1:1935/live/main → YouTube ingest
#############################################################

logLevel: info

# Sources sometimes stall (measured: googlevideo resets the connection). The default 10s
# read timeout fires before the publisher's watchdog and tears the whole path down; a larger
# value lets the publisher own the handover.
readTimeout: 30s

# Observability API: healthcheck.py, loopwatch.py and relay.py --observe all read this.
api: yes
apiAddress: 127.0.0.1:9997

# Publishers (playout.sh / relay.py push into this).
# Note: `:1935` listens on every network interface. Use 127.0.0.1:1935 when only this
# machine connects; opening it to the LAN is only needed for another machine to pull the
# stream, and then add credentials (see paths below).
rtmp: yes
rtmpAddress: :1935

# HLS is off by default: measured, every path still does one wasted remux when nobody is
# watching (about +1.1% CPU per path). Turn it on for browser previews and bind it to 127.0.0.1.
hls: no
# hlsAddress: 127.0.0.1:8888

# Protocols that are not used are turned off explicitly, so fewer ports stay open.
rtsp: no
srt: no
webrtc: no
moq: no

# Path allow-list: only the names listed here are accepted.
# This is a deliberate secure default. With `all_others:` (the MediaMTX default)
# anyone can publish to any path name.
paths:
  live/main:

    # When exposed to the LAN or shared, set at least one publish/read credential:
    #
    # publishUser: publisher
    # publishPass: <CHANGE_ME>
    # readUser: viewer
    # readPass: <CHANGE_ME>
    #
    # Once set, SRC in playout.sh and DEST in yt_publish.sh must carry the credentials:
    #   rtmp://publisher:<CHANGE_ME>@127.0.0.1:1935/live/main

  # To restore the old "accept any path" behaviour, replace the block above with:
  # all_others:
#
# When the path name changes, update all three places:
#   DEST / PATH_NAME in playout.sh
#   SRC in yt_publish.sh
#   SRC in launchd/com.loopcastr.publish.plist

