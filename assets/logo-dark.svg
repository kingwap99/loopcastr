<!-- loopcastr wordmark (dark background): Infinite Broadcast -->
<!-- viewBox is a little wider than the proposed 340: the tagline "ALWAYS ON. ALWAYS PLAYING." gets clipped at 340 -->
<svg viewBox="0 0 400 160" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lcgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#40E0D0" />
      <stop offset="100%" stop-color="#6C63FF" />
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="144" height="144" rx="36" fill="#151D35" />
  <path d="M111 55 A43 43 0 0 0 40 53" fill="none" stroke="url(#lcgrad)" stroke-width="11" stroke-linecap="round" />
  <path d="M40 53 L40 30 L62 39 Z" fill="#40E0D0" />
  <path d="M49 105 A43 43 0 0 0 120 107" fill="none" stroke="url(#lcgrad)" stroke-width="11" stroke-linecap="round" />
  <path d="M120 107 L120 130 L98 121 Z" fill="#6C63FF" />
  <path d="M69 58 Q69 54 74 57 L101 77 Q106 80 101 83 L74 103 Q69 106 69 100 Z" fill="#FFFFFF" />
  <!-- One text plus a tspan: the layout engine places "loop" and "castr" in sequence.
       With two separate text elements and a fixed x offset, a font swap (Inter -> Arial) opens a gap. -->
  <text x="170" y="87" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" letter-spacing="-1.4" fill="#F8FAFC">loop<tspan fill="#40E0D0">castr</tspan></text>
  <text x="172" y="111" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="2.2" fill="#8D9AB8">ALWAYS ON. ALWAYS PLAYING.</text>
</svg>
